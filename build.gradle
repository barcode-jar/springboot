plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.18'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '8'

repositories {
	mavenCentral()
}

dependencies {
	// Barcode.jar（体験版。出力に「SAMPLE」の印が付きます）
	implementation 'ac.pao:barcode-jar:5.3.1'
	// PDF 出力（Apache PDFBox と、Graphics2D で PDF に描く pdfbox-graphics2d。どちらも Apache License 2.0）
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'de.rototor.pdfbox:graphics2d:3.0.5'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
